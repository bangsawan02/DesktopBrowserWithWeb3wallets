name: Run Alpine Desktop with Free Cloudflare Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache dari Run Sebelumnya (Jika Ada)
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      - name: Setup Cloudflared & Run Alpine WebTop
        run: |
          # Download binary cloudflared
          sudo curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # Jalankan Container Alpine Desktop
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-xfce

      - name: Start Quick Tunnel and Get URL Fast
        run: |
          cloudflared tunnel --url http://localhost:3000 > cloudflare.log 2>&1 &

          echo "Menunggu URL Cloudflare..."
          for i in {1..15}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflare.log || true)
            if [ -n "$URL" ]; then
              echo "=================================================="
              echo " KLIK LINK DI BAWAH INI UNTUK MENGAKSES DESKTOP:"
              echo "$URL"
              echo "=================================================="
              exit 0
            fi
            sleep 1
          done

          cat cloudflare.log

      - name: Keep Alive
        run: |
          echo "Workflow berjalan. Silakan akses link di atas."
          sleep 3600

      # 2. Simpan Cache PAKSA meskipun di-Cancel / Gagal
      - name: Save persistent data cache
        if: always() # Tetap berjalan walau tombol Cancel ditekan
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 3. Tetap Upload sebagai Artifact agar bisa di-download manual
      - name: Save data via Artifacts
        if: always() # Tetap berjalan walau di-cancel
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
